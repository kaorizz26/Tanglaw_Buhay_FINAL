<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff sign in · Tanglaw-Buhay</title></head>
<body>
<main>
  <h1>Tanglaw-Buhay staff sign in</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <p><label for="username">Username</label><br><input id="username" name="username" autocomplete="username" maxlength="64" required></p>
    <p><label for="password">Password</label><br><input id="password" type="password" name="password" autocomplete="current-password" maxlength="1024" required></p>
    <button type="submit">Sign in</button>
  </form>
  <p>Authorized staff access. Household records are not displayed in this interface.</p>
</main>
</body>
</html>
