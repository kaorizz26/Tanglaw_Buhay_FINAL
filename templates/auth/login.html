<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Tanglaw-Buhay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <script src="{{ url_for('static', filename='js/password-toggle.js') }}" defer></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#login-title">Skip to sign in</a>
  <main class="login-layout">
    {% include 'auth/_identity_panel.html' %}

    <section class="login-area" aria-labelledby="login-title">
      <div class="login-content">
        <header class="login-header">
          <p class="login-eyebrow">Authorized LGU Access</p>
          <h1 id="login-title">Sign in to Tanglaw-Buhay</h1>
          <p class="supporting-text">Sign in using your assigned LGU account.</p>
        </header>

        {% if error %}
          <div class="form-alert" id="login-error"><p role="alert">{{ error }}</p></div>
        {% endif %}

        <form class="login-form" method="post" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   value="{{ request.form.get('username', '') }}"
                   autocomplete="username" maxlength="64"
                   {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}
                   required autofocus>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-field" data-password-field>
              <input id="password" name="password" type="password"
                     autocomplete="current-password" maxlength="1024"
                     {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}
                     required>
              <button class="password-toggle" type="button" data-password-toggle
                      data-label="password" aria-pressed="false"
                      aria-label="Show password" hidden>Show</button>
            </div>
          </div>
          <button class="primary-button" type="submit">Sign in</button>
        </form>
        <p class="assistance-note">Having trouble signing in? Contact your system administrator.</p>
        <p class="authorized-note">Authorized LGU personnel only.</p>
      </div>
    </section>
  </main>
</body>
</html>
