<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff sign out · Tanglaw-Buhay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="auth-page">
  <a class="skip-link" href="#logout-title">Skip to sign out</a>
  <main class="login-layout">
    {% include 'auth/_identity_panel.html' %}
    <section class="login-area" aria-labelledby="logout-title">
      <div class="login-content auth-message-card">
        <span class="auth-message-icon auth-message-icon-neutral" aria-hidden="true">↗</span>
        <p class="login-eyebrow">Account security</p>
        <h1 id="logout-title">Sign out</h1>
        <p class="supporting-text">Signing out ends all active sessions for your account.</p>
        <form class="logout-actions" method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="primary-button" type="submit">Sign out</button>
          <a class="secondary-link" href="{{ url_for('auth.change_password' if g.user.get('must_change_password') else 'main.administration' if g.user['role'] == 'system_administrator' else 'main.index') }}">Return to {{ 'password setup' if g.user.get('must_change_password') else 'dashboard' }}</a>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
