<section class="import-process-guide import-process-guide-steps-only" aria-label="Data import steps">
  <ol class="import-workflow">
    <li>
      <a class="import-workflow-step{% if current_import_step == 1 %} import-workflow-current{% endif %}"
         href="{{ '#upload-heading' if current_import_step == 1 else url_for('main.data_import') }}"
         {% if current_import_step == 1 %}aria-current="step"{% endif %}>
        <span class="import-workflow-number" aria-hidden="true">1</span>
        <span class="import-workflow-title">Upload CBMS source files</span>
        <span class="import-workflow-arrow" aria-hidden="true">{{ '↓' if current_import_step == 1 else '→' }}</span>
      </a>
    </li>
    <li>
      <a class="import-workflow-step{% if current_import_step == 2 %} import-workflow-current{% endif %}"
         href="{{ '#batches-heading' if current_import_step == 2 else url_for('main.import_batches') }}"
         {% if current_import_step == 2 %}aria-current="step"{% endif %}>
        <span class="import-workflow-number" aria-hidden="true">2</span>
        <span class="import-workflow-title">Prepare assessments</span>
        <span class="import-workflow-arrow" aria-hidden="true">{{ '↓' if current_import_step == 2 else '→' }}</span>
      </a>
    </li>
    <li>
      <a class="import-workflow-step{% if current_import_step == 3 %} import-workflow-current{% endif %}"
         href="{{ '#current-batch-heading' if current_import_step == 3 else url_for('main.import_activation') }}"
         {% if current_import_step == 3 %}aria-current="step"{% endif %}>
        <span class="import-workflow-number" aria-hidden="true">3</span>
        <span class="import-workflow-title">Activate dataset</span>
        <span class="import-workflow-arrow" aria-hidden="true">{{ '↓' if current_import_step == 3 else '→' }}</span>
      </a>
    </li>
  </ol>
</section>
