<fieldset class="accounts-delivery-options">
  <legend>Give the temporary password</legend>
  <label class="accounts-delivery-choice">
    <input type="radio" name="delivery_method" value="email" checked>
    <span><strong>Send automatically by email</strong><small>Use the address the staff member gives you in person. It is used only for this message.</small></span>
  </label>
  <div class="accounts-delivery-email-fields">
    <div class="accounts-field">
      <label for="recipient-email">Staff email address</label>
      <input id="recipient-email" name="recipient_email" type="email" inputmode="email" autocomplete="off" maxlength="254">
    </div>
    <div class="accounts-field">
      <label for="confirm-recipient-email">Confirm staff email address</label>
      <input id="confirm-recipient-email" name="confirm_recipient_email" type="email" inputmode="email" autocomplete="off" maxlength="254">
    </div>
    <label class="accounts-delivery-verification">
      <input type="checkbox" name="verified_in_person" value="yes">
      <span>I confirmed this address with the staff member in person.</span>
    </label>
  </div>
  <label class="accounts-delivery-choice">
    <input type="radio" name="delivery_method" value="display">
    <span><strong>Show it for direct handoff</strong><small>Copy or show the password while the staff member is with you.</small></span>
  </label>
</fieldset>
